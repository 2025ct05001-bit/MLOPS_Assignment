replicaCount: 2

image:
  repository: heart-disease-api
  pullPolicy: IfNotPresent
  tag: "v3"

service:
  type: ClusterIP
  port: 80
  targetPort: 8000
  nodePort: 30080

ingress:
  enabled: true
  className: "nginx"
  host: "heart-disease-api.local"
  path: "/"
  pathType: Prefix

env:
  modelPath: "/app/model_export"